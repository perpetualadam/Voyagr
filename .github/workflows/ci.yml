name: CI

# Runs the full test suite on every push/PR to main:
#   - JS: tautological-test guard (lint:tests) + Jest with coverage thresholds
#   - Python: behaviour-first unit tests. Two groups:
#       * navigation/detector suites (lane recommendation, GraphHopper mapping,
#         lane guidance, speed-limit detector)
#       * routing-service suites guarding the /api/route modularization (request
#         parsing, Valhalla payloads/classifier/POST, route entries, response
#         envelope, maneuvers, OSRM fallback, hazard dedup, enrichment, route
#         preview variety/costing preferences, and a Flask-level smoke of
#         calculate_route with mocked engines)
#     All chosen suites exercise real module logic and tolerate missing network/DB
#     (live Overpass/TomTom calls and absent hazard_preferences fall back to
#     defaults), so they stay green offline. Suites needing the Kivy/satnav desktop
#     stack, a local custom_router package, or live servers are intentionally excluded.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Jest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # --ignore-scripts skips the picovoice postinstall sync (not needed for tests).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Guard against tautological tests
        run: npm run lint:tests

      - name: Run Jest with coverage thresholds
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: js-coverage
          path: coverage/
          if-no-files-found: ignore

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt
          pip install pytest
          pip install -r requirements-geometry.txt

      - name: Run Python behaviour tests
        run: >-
          pytest -q --junitxml=/tmp/voyagr-backend-results.xml
          tests/test_graphhopper_sign_mapping.py
          tests/test_lane_recommendation.py
          tests/test_lane_guidance.py
          tests/test_speed_limit_detector.py
          tests/test_route_request_params.py
          tests/test_valhalla_acceptance.py
          tests/test_valhalla_payload.py
          tests/test_valhalla_maneuvers.py
          tests/test_valhalla_parsing.py
          tests/test_init_db_schema.py
          tests/test_multidrop_request.py
          tests/test_valhalla_excludes.py
          tests/test_graphhopper_attempt.py
          tests/test_graphhopper_diagnostics.py
          tests/test_graphhopper_model_composition.py
          tests/test_graphhopper_capabilities.py
          tests/test_phase10_routing.py
          tests/test_phase12b_geometry.py
          tests/test_phase12c_acceptance.py
          tests/test_phase12f_origin.py
          tests/test_phase12fb_acceptance.py
          tests/test_origin_replay_transport.py
          tests/test_independent_road_oracle.py
          tests/test_private_road_oracle.py
          tests/test_motorcar_investigation.py
          tests/test_review_package.py
          tests/test_review_package_diagnostics.py
          tests/test_phase11c_acceptance_tools.py
          tests/test_phase11b_overpass.py
          tests/test_phase11_overpass_audit.py
          tests/test_graphhopper_costing_parity.py
          tests/test_graphhopper_route_request.py
          tests/test_graphhopper_fallback.py
          tests/test_route_discovery.py
          tests/test_route_variety.py
          tests/test_preference_route_variety.py
          tests/test_route_costing_options.py
          tests/test_osrm_maneuvers.py
          tests/test_route_entries.py
          tests/test_route_success_response.py
          tests/test_route_enrichment.py
          tests/test_osrm_fallback.py
          tests/test_hazards_dedup.py
          tests/test_voice_hazard_type_alignment.py
          tests/test_voice_report_police_debris.py
          tests/test_voice_ui_hazard_examples.py
          tests/test_voice_hazard_command_parse.py
          tests/test_voice_hazard_report_parity.py
          tests/test_voice_hazard_docs_contract.py
          tests/test_persistent_route_cache.py
          tests/test_route_cache_invalidation.py
          tests/test_deployed_version.py
          tests/test_calculate_route_smoke.py
          tests/test_optimised_camera_avoidance.py
          tests/test_graphhopper_shape_index.py
          tests/test_graphhopper_camera_areas.py
          tests/test_admin_auth.py
          tests/test_route_logging_privacy.py
          tests/test_speed_limit_fixes.py
          tests/test_dashcam_service.py
          tests/test_dashcam_blueprint.py
          tests/test_page_dos_hardening.py
          tests/test_api_keys.py
          tests/test_traffic_tile_proxy.py
          tests/test_dashcam_ownership.py
          tests/test_routing_avoidance_integrity.py
          tests/test_phase5_journey.py
          tests/test_phase6_navigation_evidence.py
          tests/test_phase7_road_matching.py
          tests/test_phase8_evidence.py
          tests/test_phase9_evidence.py
          tests/test_routing_request_budget.py

      - name: Report bounded backend failure diagnostics
        if: failure()
        run: |
          python - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          report={}
          try:
              report['failed_tests']=sorted({case.get('classname','')+'.'+case.get('name','').split('[')[0] for case in ET.parse('/tmp/voyagr-backend-results.xml').iter('testcase') if case.find('failure') is not None or case.find('error') is not None})
              from voyagr.utils.camera_area_candidate import build_candidate,encode
              raw,manifest,metrics=build_candidate(Path('camera_areas.geojson').read_bytes())
              target=Path('artifacts/camera-areas/phase12b')
              expected_manifest=json.loads((target/'manifest.json').read_text())
              expected_metrics=json.loads((target/'feature_metrics.json').read_text())
              report['candidate_bytes_match']=raw==(target/'camera_areas_candidate.geojson').read_bytes()
              report['manifest_changed_fields']=sorted(k for k in manifest if manifest[k]!=expected_manifest.get(k))
              report['metrics_changed_fields']=sorted({k for actual,expected in zip(metrics,expected_metrics) for k in actual if actual[k]!=expected.get(k)})
              report['library_versions']=manifest['libraries']
          except Exception as error:
              report['diagnostic_error_type']=type(error).__name__
          print('::notice title=Bounded backend failure diagnostics::'+json.dumps(report,sort_keys=True))
          PY

  dashcam-session-policy:
    name: Dashcam session SQL policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL test tools
        run: python -m pip install pgserver==0.1.4 psycopg2-binary==2.9.13
      - name: Verify session policy on temporary PostgreSQL
        run: python scripts/test-dashcam-session-sql.py
