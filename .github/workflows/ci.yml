name: CI

# Runs the full test suite on every push/PR to main:
#   - JS: tautological-test guard (lint:tests) + Jest with coverage thresholds
#   - Python: behaviour-first unit tests. Two groups:
#       * navigation/detector suites (lane recommendation, GraphHopper mapping,
#         lane guidance, speed-limit detector)
#       * routing-service suites guarding the /api/route modularization (request
#         parsing, Valhalla payloads/classifier/POST, route entries, response
#         envelope, maneuvers, OSRM fallback, hazard dedup, enrichment, and a
#         Flask-level smoke of calculate_route with mocked engines)
#     All chosen suites exercise real module logic and tolerate missing network/DB
#     (live Overpass/TomTom calls and absent hazard_preferences fall back to
#     defaults), so they stay green offline. Suites needing the Kivy/satnav desktop
#     stack, a local custom_router package, or live servers are intentionally excluded.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Jest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts skips the picovoice postinstall sync (not needed for tests).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Guard against tautological tests
        run: npm run lint:tests

      - name: Run Jest with coverage thresholds
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: coverage/
          if-no-files-found: ignore

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt
          pip install pytest

      - name: Run Python behaviour tests
        run: >-
          pytest -q
          tests/test_graphhopper_sign_mapping.py
          tests/test_lane_recommendation.py
          tests/test_lane_guidance.py
          tests/test_speed_limit_detector.py
          tests/test_route_request_params.py
          tests/test_valhalla_payload.py
          tests/test_valhalla_maneuvers.py
          tests/test_osrm_maneuvers.py
          tests/test_route_entries.py
          tests/test_route_success_response.py
          tests/test_route_enrichment.py
          tests/test_osrm_fallback.py
          tests/test_hazards_dedup.py
          tests/test_calculate_route_smoke.py
          tests/test_optimised_camera_avoidance.py
          tests/test_graphhopper_shape_index.py
          tests/test_graphhopper_camera_areas.py
