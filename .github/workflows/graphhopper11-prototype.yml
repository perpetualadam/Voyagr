name: Isolated GraphHopper 11.1 synthetic prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'prototypes/graphhopper11/**'
      - 'tests/test_gh11_prototype.py'
      - 'tests/test_gh11_integration_boundary.py'
      - 'tests/test_gh11_isolated_app.py'
      - 'tests/test_gh11_policy_compiler.py'
      - 'tests/test_gh11_app_settings_adapter.py'
      - 'tests/test_gh11_app_request_bridge.py'
      - 'voyagr/avoidance_contract.py'
      - 'static/js/modules/navigation/routing-request.js'
      - 'tests/test_gh11_container_package.py'
      - 'voyagr/services/routing/private_route_cache.py'
      - 'voyagr/utils/graphhopper.py'
      - 'voyagr/services/routing/integrity.py'
      - 'static/js/modules/navigation/strict-route-policy.js'
      - 'static/js/modules/navigation/polyline-codec.js'
      - 'static/js/modules/navigation/route-selection.js'
      - 'static/js/__tests__/gh11-strict-navigation.test.js'
      - 'static/js/modules/navigation/avoidance-integrity.js'
      - 'static/js/app/navigation-safety-ux.js'
      - 'static/js/app/route-comparison-orchestration.js'
      - '.github/workflows/graphhopper11-prototype.yml'

permissions:
  contents: read

jobs:
  synthetic:
    # Playwright 1.56.1 supports Ubuntu 24.04; latest may advance beyond it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch and verify patched runtime (no map datasets)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 \
            --output "$RUNNER_TEMP/graphhopper-web-11.1.jar" \
            https://github.com/graphhopper/graphhopper/releases/download/11.1/graphhopper-web-11.1.jar
          echo "8462f758d9ea49edaded557cec5c687a0a24f004ec371cd4daaeb0534824ea33  $RUNNER_TEMP/graphhopper-web-11.1.jar" | sha256sum --check
      - name: Test synthetic graph and independent response validator
        env:
          GH11_PROTOTYPE_JAR: ${{ runner.temp }}/graphhopper-web-11.1.jar
        run: |
          python -m pip install pytest "Flask>=3.1.2,<4"
          python -m pytest -q tests/test_gh11_prototype.py tests/test_gh11_integration_boundary.py tests/test_gh11_isolated_app.py tests/test_gh11_container_package.py tests/test_gh11_policy_compiler.py tests/test_gh11_app_settings_adapter.py tests/test_gh11_app_request_bridge.py

      - name: Install isolated browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test real Chromium against loopback-only synthetic GH11
        env:
          GH11_PROTOTYPE_JAR: ${{ runner.temp }}/graphhopper-web-11.1.jar
          GH11_BROWSER_ACCEPTANCE: '1'
        run: python -m pytest -q tests/test_gh11_isolated_app.py -k real_chromium

  container-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download hash-locked wheels with TLS verification
        run: python -m prototypes.graphhopper11.container.prepare_wheels
      - name: Build network-disabled installation layers
        run: docker build --platform linux/amd64 --network none -f prototypes/graphhopper11/container/Dockerfile -t voyagr-gh11-package-ci .
      - name: Fetch pinned patched test runtime only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 \
            --output "$RUNNER_TEMP/graphhopper-web-11.1.jar" \
            https://github.com/graphhopper/graphhopper/releases/download/11.1/graphhopper-web-11.1.jar
          echo "8462f758d9ea49edaded557cec5c687a0a24f004ec371cd4daaeb0534824ea33  $RUNNER_TEMP/graphhopper-web-11.1.jar" | sha256sum --check
      - name: Test generated graph through Unix-socket WSGI service and remove it
        run: python -m prototypes.graphhopper11.container.smoke --image voyagr-gh11-package-ci --jar "$RUNNER_TEMP/graphhopper-web-11.1.jar" --workspace "$RUNNER_TEMP"
