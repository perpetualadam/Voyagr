name: Isolated privacy HTTP lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/privacy-http-lab/**'
      - '.github/workflows/privacy-http-lab.yml'
      - 'static/js/modules/privacy/**'
      - 'static/js/app/local-data.js'
      - 'static/js/app/supabase-auth-orchestration.js'
      - 'static/js/app/profile-store-orchestration.js'
      - 'templates/index.html'
      - 'service-worker.js'

permissions:
  contents: read

jobs:
  privacy-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify disposable HTTP services and full candidate browser
        run: python3 scripts/privacy-http-lab/run.py --browser
