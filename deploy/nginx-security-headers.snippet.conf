# Voyagr HTTPS security headers — include inside server { } blocks that terminate TLS.
#
# Install on VPS:
#   sudo cp /opt/voyagr/deploy/nginx-security-headers.snippet.conf \
#       /etc/nginx/snippets/voyagr-security-headers.conf
#
# Then in each HTTPS server { }:
#   include snippets/voyagr-security-headers.conf;
#
# Also include this file in any location { } that sets its own add_header
# (Cache-Control etc.), because nginx does not inherit server-level add_header
# into those locations.
#
# Intentionally NO Content-Security-Policy here — a strict CSP can break the PWA
# (inline boot scripts, MapLibre workers, GA4). HSTS + nosniff are safe defaults.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
