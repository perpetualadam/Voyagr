# =============================================================================
# Complete nginx site: https://vibevoyager.org (Voyagr PWA on VPS1 + tiles on VPS2)
#
# Architecture (your setup):
#   VPS1 81.0.246.97  — Gunicorn 127.0.0.1:5000, this nginx terminates TLS for vibevoyager.org
#   VPS2 149.102.131.27:8088 — tileserver-gb (maptiler/tileserver-gl), NOT nominatim :8080
#
# Install on VPS1:
#   sudo cp deploy/nginx-vibevoyager.org.conf /etc/nginx/sites-available/vibevoyager.org
#   sudo ln -sf /etc/nginx/sites-available/vibevoyager.org /etc/nginx/sites-enabled/vibevoyager.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# If Certbot already edited this file, merge: keep ssl_certificate lines Certbot added if paths differ.
# On VPS2 firewall, allow 8088 from 81.0.246.97 if tiles are not publicly reachable.
#
# Rate limit: applies to /api/* only (not /map/ — MapLibre issues many parallel tile requests).
# Behind Cloudflare, set real_ip_from CF and use $binary_remote_addr (see walkthrough in repo
# or Cloudflare docs) so limits apply per visitor, not per edge node.
# =============================================================================

limit_req_zone $binary_remote_addr zone=voyagr_vibevoyager_api:10m rate=25r/s;

upstream voyagr_tileserver_gb {
    server 149.102.131.27:8088;
    keepalive 16;
}

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name vibevoyager.org www.vibevoyager.org;
    return 301 https://$host$request_uri;
}

# --- HTTPS (app + proxied tiles) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibevoyager.org www.vibevoyager.org;

    ssl_certificate     /etc/letsencrypt/live/vibevoyager.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibevoyager.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (HSTS, nosniff). Copy snippet to /etc/nginx/snippets/ on VPS — see file header.
    include snippets/voyagr-security-headers.conf;

    # -------------------------------------------------------------------------
    # MapLibre: browser uses /map/styles/... ; tileserver-gl serves /styles/...
    # Trailing slash on proxy_pass strips the /map prefix.
    # -------------------------------------------------------------------------
    location /map/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://voyagr_tileserver_gb/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        expires 1d;
        add_header Cache-Control "public";
        include snippets/voyagr-security-headers.conf;
    }

    # TileServer root JSON (some clients request these at site root)
    location = /fonts.json {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://voyagr_tileserver_gb/fonts.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /styles.json {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://voyagr_tileserver_gb/styles.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /fonts/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://voyagr_tileserver_gb/fonts/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /styles/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://voyagr_tileserver_gb/styles/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /data/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://voyagr_tileserver_gb/data/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /glyphs/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://voyagr_tileserver_gb/glyphs/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /sprites/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://voyagr_tileserver_gb/sprites/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /tiles/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://voyagr_tileserver_gb/tiles/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Voyagr API (Gunicorn) — rate limit sustained abuse; burst allows parallel SPA calls
    # -------------------------------------------------------------------------
    location ^~ /api/ {
        limit_req zone=voyagr_vibevoyager_api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # Voyagr app (Gunicorn)
    # -------------------------------------------------------------------------
    location /static/ {
        proxy_pass http://127.0.0.1:5000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
        include snippets/voyagr-security-headers.conf;
    }

    location = /service-worker.js {
        proxy_pass http://127.0.0.1:5000/service-worker.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include snippets/voyagr-security-headers.conf;
    }

    # PWA shell HTML — must not be cached (template flags, injected globals). Matches Flask no-store.
    location = / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        include snippets/voyagr-security-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
