server {
    listen 80;
    server_name voyagr.perpetualadam.com 81.0.246.97;

    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # MapLibre tile stack proxy (served by separate maps server)
    #
    # IMPORTANT:
    # - tileserver-gl typically returns style.json with absolute URLs (glyphs/sprites/tiles) based on the Host header.
    # - keep Host as $host (Voyagr domain), so the style references remain same-origin and the browser keeps
    #   requesting via Voyagr (which then proxies to the maps server). This avoids needing to open the maps server
    #   to the public internet.
    location ^~ /map/ {
        proxy_pass http://149.102.131.27;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;

        expires 1d;
        add_header Cache-Control "public";
    }

    # tileserver-gl follow-up requests (these are commonly referenced inside style.json)
    location ^~ /styles/ { proxy_pass http://149.102.131.27; proxy_set_header Host $host; }
    location ^~ /fonts/  { proxy_pass http://149.102.131.27; proxy_set_header Host $host; }
    location ^~ /glyphs/ { proxy_pass http://149.102.131.27; proxy_set_header Host $host; }
    location ^~ /sprites/ { proxy_pass http://149.102.131.27; proxy_set_header Host $host; }
    location ^~ /data/   { proxy_pass http://149.102.131.27; proxy_set_header Host $host; }
    location ^~ /tiles/  { proxy_pass http://149.102.131.27; proxy_set_header Host $host; }

    # Static files caching
    location /static/ {
        proxy_pass http://127.0.0.1:5000/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Service worker - no cache
    location /service-worker.js {
        proxy_pass http://127.0.0.1:5000/service-worker.js;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

