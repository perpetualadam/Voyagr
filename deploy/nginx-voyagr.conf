# Voyagr nginx site (DuckDNS / perpetualadam hostnames).
#
# For extra hostnames (e.g. vibevoyager.org), prefer deploy/nginx-vibevoyager.org.conf
# or duplicate the map tile `location` blocks / include deploy/nginx-map-tile-proxy.snippet.conf.
#
# DoS hardening (application-layer):
# - limit_req on GET / (PWA shell is no-store → every hit reaches gunicorn)
# - limit_req on /api/* (expensive routing)
# - limit_conn per IP (concurrent connection flood)
# - client_max_body_size (no large uploads in this app)
# MapLibre tile paths are NOT rate-limited (many parallel tile requests are normal).
# Behind Cloudflare, configure real_ip from CF so $binary_remote_addr is the visitor.

limit_req_zone $binary_remote_addr zone=voyagr_page:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=voyagr_api:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=voyagr_conn:10m;

server {
    listen 80;
    # Include every hostname users type (DuckDNS, custom domain, raw IP). Missing a name here → wrong vhost / connection reset.
    server_name voyagr.perpetualadam.com vibevoyagr.duckdns.org 81.0.246.97;

    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    # Voyagr has no large file uploads; JSON bodies stay small.
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Cap concurrent connections per client IP (slowloris / connection floods).
    limit_conn voyagr_conn 40;
    limit_conn_status 429;

    # PWA shell HTML — do not cache (wake/Sherpa template; align with Flask core.index headers).
    location = / {
        limit_req zone=voyagr_page burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # API — sustained abuse protection; burst allows parallel SPA calls on load.
    location ^~ /api/ {
        limit_req zone=voyagr_api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # MapLibre tile stack proxy (served by separate maps server)
    #
    # IMPORTANT:
    # - tileserver-gl typically returns style.json with absolute URLs (glyphs/sprites/tiles) based on the Host header.
    # - keep Host as $host (Voyagr domain), so the style references remain same-origin and the browser keeps
    #   requesting via Voyagr (which then proxies to the maps server). This avoids needing to open the maps server
    #   to the public internet.
    location ^~ /map/ {
        proxy_pass http://81.0.246.97;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;

        expires 1d;
        add_header Cache-Control "public";
    }

    # tileserver-gl follow-up requests (these are commonly referenced inside style.json)
    location ^~ /styles/ { proxy_pass http://81.0.246.97; proxy_set_header Host $host; }
    location ^~ /fonts/  { proxy_pass http://81.0.246.97; proxy_set_header Host $host; }
    location ^~ /glyphs/ { proxy_pass http://81.0.246.97; proxy_set_header Host $host; }
    location ^~ /sprites/ { proxy_pass http://81.0.246.97; proxy_set_header Host $host; }
    location ^~ /data/   { proxy_pass http://81.0.246.97; proxy_set_header Host $host; }
    location ^~ /tiles/  { proxy_pass http://81.0.246.97; proxy_set_header Host $host; }

    # Static files caching
    location /static/ {
        proxy_pass http://127.0.0.1:5000/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Service worker - no cache
    location /service-worker.js {
        proxy_pass http://127.0.0.1:5000/service-worker.js;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

