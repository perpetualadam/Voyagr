# Enable only after the dedicated certificate and password file exist.
# The long-running phone candidate must bind exclusively to 127.0.0.1:18081.
# Do not use scripts/privacy-http-lab/full_app.py: it has a fixture-only endpoint.
server {
    listen 443 ssl;
    server_name voyagr-phone-test.vibevoyager.org;
    ssl_certificate /etc/letsencrypt/live/voyagr-phone-test.vibevoyager.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voyagr-phone-test.vibevoyager.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Voyagr private phone test";
    auth_basic_user_file /etc/nginx/voyagr-phone-test.htpasswd;
    access_log off;
    error_log /dev/null;
    client_max_body_size 16m;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self)" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # The Basic password protects this guest-only test origin, not API identity.
    # Never forward it, or user IP headers, to routing/map/application services.
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # Never expose automated test fixtures, database REST, or an auth gateway.
    location ^~ /__lab__/ { return 404; }
    location ^~ /auth/v1/ { return 404; }
    location ^~ /rest/v1/ { return 404; }

    # Avoid forwarding a real test user's community reports or feedback.
    location = /api/hazards/report { return 403; }
    location = /api/hazards/add-camera { return 403; }
    location = /api/speed-limit/feedback { return 403; }

    # Existing VPS2 tile server. Preserve same-origin paths in its style responses.
    location ^~ /map/ { proxy_pass http://127.0.0.1:8088/; }
    location ^~ /styles/ { proxy_pass http://127.0.0.1:8088; }
    location ^~ /fonts/ { proxy_pass http://127.0.0.1:8088; }
    location ^~ /glyphs/ { proxy_pass http://127.0.0.1:8088; }
    location ^~ /sprites/ { proxy_pass http://127.0.0.1:8088; }
    location ^~ /data/ { proxy_pass http://127.0.0.1:8088; }
    location ^~ /tiles/ { proxy_pass http://127.0.0.1:8088; }

    # Preserve application cache headers: the real worker verifies immutable assets.
    location / { proxy_pass http://127.0.0.1:18081; }
}
