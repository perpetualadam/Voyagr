# Staging only. Install separately; do not edit the existing auth virtual host.
server {
    listen 80;
    server_name voyagr-phone-test.vibevoyager.org;
    access_log off;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/voyagr-phone-acme;
        try_files $uri =404;
    }

    # Never serve the candidate or a password prompt over plaintext HTTP.
    location / {
        return 308 https://voyagr-phone-test.vibevoyager.org$request_uri;
    }
}
