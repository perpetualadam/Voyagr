# =============================================================================
# Paste INSIDE each Voyagr `server { ... }` block (HTTP and HTTPS) that serves the PWA.
# Without these locations, MapLibre requests to /map/... return 404 → blank map.
#
# Upstream: tileserver-gl / OpenMapTiles.
#
# Trailing slash on proxy_pass (ONLY in the /map/ block) strips the /map prefix:
#   Browsers request  /map/styles/liberty/style.json
#   Upstream receives /styles/liberty/style.json
# Use `proxy_pass http://HOST:PORT/;` for local tileserver (default paths, no /map).
# Use `proxy_pass http://HOST:PORT;`  (no trailing slash) if upstream already serves /map/...
# =============================================================================

    location ^~ /map/ {
        proxy_pass http://81.0.246.97;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        expires 1d;
        add_header Cache-Control "public";
    }

    location ^~ /styles/ { proxy_pass http://81.0.246.97; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /fonts/  { proxy_pass http://81.0.246.97; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /glyphs/ { proxy_pass http://81.0.246.97; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /sprites/ { proxy_pass http://81.0.246.97; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /data/   { proxy_pass http://81.0.246.97; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /tiles/  { proxy_pass http://81.0.246.97; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
