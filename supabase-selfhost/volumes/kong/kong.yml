_format_version: "1.1"

services:
  # ── Auth (GoTrue) ──────────────────────────────────────────────────
  - name: auth-v1
    url: http://auth:9999
    routes:
      - name: auth-v1-routes
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Encoding
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
            - x-supabase-api-version
            - x-my-custom-header
          exposed_headers:
            - X-Total-Count
          credentials: true
          max_age: 3600

  # ── REST (PostgREST) ──────────────────────────────────────────────
  - name: rest-v1
    url: http://rest:3000
    routes:
      - name: rest-v1-routes
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Encoding
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
            - x-supabase-api-version
            - Prefer
            - Range
            - accept-profile
            - content-profile
          exposed_headers:
            - X-Total-Count
            - Content-Range
          credentials: true
          max_age: 3600
