# Nginx reverse proxy for self-hosted Supabase
# Add this inside your existing server { } block for vibevoyagr.duckdns.org
#
# Kong (Supabase API gateway) listens on 127.0.0.1:8000

# Auth endpoint: /supabase/auth/v1/*
location /supabase/auth/v1/ {
    proxy_pass http://127.0.0.1:8000/auth/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# REST endpoint: /supabase/rest/v1/*
location /supabase/rest/v1/ {
    proxy_pass http://127.0.0.1:8000/rest/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
