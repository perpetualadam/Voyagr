<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Pedestrian (aerial view) -->
  <g transform="translate(25, 25)">
    <!-- Head -->
    <circle cx="0" cy="-8" r="5" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.5"/>
    
    <!-- Body -->
    <ellipse cx="0" cy="2" rx="6" ry="10" fill="#A78BFA" stroke="#6D28D9" stroke-width="1.5"/>
    
    <!-- Arms (extended slightly) -->
    <ellipse cx="-7" cy="0" rx="2" ry="6" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1"/>
    <ellipse cx="7" cy="0" rx="2" ry="6" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1"/>
    
    <!-- Legs -->
    <ellipse cx="-3" cy="10" rx="2" ry="5" fill="#7C3AED" stroke="#6D28D9" stroke-width="1"/>
    <ellipse cx="3" cy="10" rx="2" ry="5" fill="#7C3AED" stroke="#6D28D9" stroke-width="1"/>
    
    <!-- Directional triangle (pointing forward/up) -->
    <path d="M 0,-17 L -5,-11 L 5,-11 Z" fill="#EC4899" stroke="#BE185D" stroke-width="1.5"/>
    
    <!-- Highlight on head -->
    <circle cx="-1" cy="-9" r="2" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>

