<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle (aerial view) -->
  <g transform="translate(25, 25)">
    <!-- Frame -->
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#4B5563" stroke-width="2"/>
    <line x1="-3" y1="-5" x2="3" y2="-5" stroke="#4B5563" stroke-width="2"/>
    <line x1="-3" y1="5" x2="3" y2="5" stroke="#4B5563" stroke-width="2"/>
    
    <!-- Handlebars -->
    <line x1="-5" y1="-10" x2="5" y2="-10" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Seat -->
    <ellipse cx="0" cy="0" rx="3" ry="2" fill="#374151"/>
    
    <!-- Front wheel -->
    <circle cx="0" cy="-10" r="5" fill="none" stroke="#1F2937" stroke-width="2"/>
    <circle cx="0" cy="-10" r="2" fill="#374151"/>
    
    <!-- Rear wheel -->
    <circle cx="0" cy="10" r="5" fill="none" stroke="#1F2937" stroke-width="2"/>
    <circle cx="0" cy="10" r="2" fill="#374151"/>
    
    <!-- Directional triangle (pointing forward/up) -->
    <path d="M 0,-19 L -5,-13 L 5,-13 Z" fill="#06B6D4" stroke="#0891B2" stroke-width="1.5"/>
  </g>
</svg>

