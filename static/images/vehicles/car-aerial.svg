<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Car body (aerial view) -->
  <g transform="translate(25, 25)">
    <!-- Main car body -->
    <rect x="-10" y="-15" width="20" height="30" rx="3" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
    
    <!-- Windshield (front) -->
    <rect x="-8" y="-13" width="16" height="6" rx="1" fill="#60A5FA" opacity="0.7"/>
    
    <!-- Rear window -->
    <rect x="-8" y="7" width="16" height="6" rx="1" fill="#60A5FA" opacity="0.7"/>
    
    <!-- Side mirrors -->
    <rect x="-12" y="-5" width="2" height="4" rx="1" fill="#1E40AF"/>
    <rect x="10" y="-5" width="2" height="4" rx="1" fill="#1E40AF"/>
    
    <!-- Wheels -->
    <rect x="-12" y="-10" width="3" height="6" rx="1" fill="#1F2937"/>
    <rect x="9" y="-10" width="3" height="6" rx="1" fill="#1F2937"/>
    <rect x="-12" y="4" width="3" height="6" rx="1" fill="#1F2937"/>
    <rect x="9" y="4" width="3" height="6" rx="1" fill="#1F2937"/>
    
    <!-- Directional triangle (pointing forward/up) -->
    <path d="M 0,-20 L -6,-12 L 6,-12 Z" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    
    <!-- Highlight on car body -->
    <rect x="-8" y="-12" width="4" height="8" rx="1" fill="#FFFFFF" opacity="0.3"/>
  </g>
</svg>

