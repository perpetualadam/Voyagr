<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Motorcycle (aerial view) -->
  <g transform="translate(25, 25)">
    <!-- Main body (narrower than car) -->
    <rect x="-5" y="-15" width="10" height="30" rx="2" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.5"/>
    
    <!-- Fuel tank area -->
    <ellipse cx="0" cy="-5" rx="6" ry="8" fill="#A78BFA" stroke="#6D28D9" stroke-width="1"/>
    
    <!-- Seat -->
    <rect x="-4" y="2" width="8" height="8" rx="2" fill="#7C3AED" stroke="#6D28D9" stroke-width="1"/>
    
    <!-- Handlebars (front) -->
    <rect x="-8" y="-13" width="16" height="2" rx="1" fill="#4B5563"/>
    
    <!-- Front wheel -->
    <ellipse cx="0" cy="-12" rx="4" ry="3" fill="#1F2937" stroke="#111827" stroke-width="1"/>
    
    <!-- Rear wheel -->
    <ellipse cx="0" cy="12" rx="4" ry="3" fill="#1F2937" stroke="#111827" stroke-width="1"/>
    
    <!-- Directional triangle (pointing forward/up) -->
    <path d="M 0,-20 L -5,-13 L 5,-13 Z" fill="#F97316" stroke="#C2410C" stroke-width="1.5"/>
    
    <!-- Highlight -->
    <ellipse cx="-2" cy="-6" rx="2" ry="3" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>

