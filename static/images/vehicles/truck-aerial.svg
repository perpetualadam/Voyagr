<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Truck (aerial view) -->
  <g transform="translate(25, 25)">
    <!-- Cargo area (larger) -->
    <rect x="-11" y="-5" width="22" height="20" rx="2" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
    
    <!-- Cab (front) -->
    <rect x="-9" y="-15" width="18" height="12" rx="2" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    
    <!-- Windshield -->
    <rect x="-7" y="-13" width="14" height="5" rx="1" fill="#FCA5A5" opacity="0.7"/>
    
    <!-- Side mirrors -->
    <rect x="-12" y="-10" width="2" height="4" rx="1" fill="#991B1B"/>
    <rect x="10" y="-10" width="2" height="4" rx="1" fill="#991B1B"/>
    
    <!-- Wheels (6 wheels for truck) -->
    <rect x="-13" y="-12" width="3" height="5" rx="1" fill="#1F2937"/>
    <rect x="10" y="-12" width="3" height="5" rx="1" fill="#1F2937"/>
    <rect x="-13" y="3" width="3" height="5" rx="1" fill="#1F2937"/>
    <rect x="10" y="3" width="3" height="5" rx="1" fill="#1F2937"/>
    <rect x="-13" y="10" width="3" height="5" rx="1" fill="#1F2937"/>
    <rect x="10" y="10" width="3" height="5" rx="1" fill="#1F2937"/>
    
    <!-- Directional triangle (pointing forward/up) -->
    <path d="M 0,-21 L -7,-13 L 7,-13 Z" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
    
    <!-- Highlight on cab -->
    <rect x="-6" y="-12" width="3" height="6" rx="1" fill="#FFFFFF" opacity="0.3"/>
  </g>
</svg>

