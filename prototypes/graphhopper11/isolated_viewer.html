<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated GH11 route experiment</title>
<style>body{font:18px system-ui;max-width:850px;margin:2rem auto;padding:1rem}button,select{font:inherit;padding:.6rem;margin:.4rem}svg{width:100%;height:380px;background:#f3f5f6;border:1px solid #bbb}#status{min-height:3rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><h1>Isolated GH11 route experiment</h1><p>Registered public test cases only. Navigation is unavailable.</p>
<label>Case <select id="cases"></select></label><button id="calculate" disabled>Calculate</button>
<p id="status" role="status">Loading registered cases…</p><label>Returned route <select id="alternatives"></select></label>
<svg id="plot" viewBox="0 0 800 360" role="img" aria-label="Calculated route geometry"><polyline id="line" fill="none" stroke="#254ecb" stroke-width="4"/></svg>
<pre id="instructions"></pre>
<script src="/prototype-viewer.js"></script></body></html>
